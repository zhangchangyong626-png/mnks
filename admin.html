<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 云和蓝天救援队</title>
<link rel="stylesheet" href="style.css">
<!-- 引入 html2canvas 用于生成海报 -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  /* 全局字体设置 */
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 300; background: #f4f7fb; color: #333; }
  h2, h3 { font-weight: 400; color: #1f2d3d; }
  label { font-weight: 300; color: #607d8b; }
  input, select, textarea, button { font-weight: 300; font-family: inherit; }
  
  .btn { font-weight: 400; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  
  .radio-group { display: flex; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
  .radio-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 14px; color: #1f2d3d; cursor: pointer; background: transparent; border: none; padding: 0; }
  .radio-item input[type="radio"] { width: 16px; height: 16px; margin: 0; cursor: pointer; }

  /* 外层大折叠面板样式 */
  .details-card { padding: 0; overflow: hidden; margin-bottom: 16px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border: none;}
  .details-card summary { padding: 18px 20px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid transparent; transition: background 0.2s; }
  .details-card summary:hover { background: #f9fbfd; }
  .details-card[open] summary { border-bottom: 1px solid #eceff1; background: #fafbfc; }
  .details-card summary::-webkit-details-marker { display: none; }
  .details-card summary h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px;}
  .details-card summary::after { content: '▼'; font-size: 12px; color: #b0bec5; transition: transform 0.3s; }
  .details-card[open] summary::after { transform: rotate(180deg); }
  .details-inner { padding: 20px; }

  .border-red { border-top: 4px solid #e53935; }

  .title-icon { width: 20px; height: 20px; fill: #e53935; }
  .title-icon.blue { fill: #1565c0; }
  .title-icon.green { fill: #2e7d32; }
  .title-icon.orange { fill: #f57f17; }

  .details-box { margin-top: 10px; border: 1px solid #cfd8dc; border-radius: 6px; overflow: hidden; background: #fff; }
  .details-box summary { padding: 12px 15px; background: #f9fbfd; color: #1565c0; font-size: 14px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  .details-box summary::-webkit-details-marker { display: none; }
  .details-box summary::after { content: '▼'; font-size: 10px; color: #b0bec5; transition: transform 0.3s; }
  .details-box[open] summary::after { transform: rotate(180deg); }
  .details-box[open] summary { border-bottom: 1px solid #eceff1; }
  .summary-title { display: flex; align-items: center; gap: 8px; }
  .summary-icon { width: 18px; height: 18px; fill: #1565c0; }
  
  .scroll-area { max-height: 300px; overflow-y: auto; padding: 12px; }
  .scroll-area::-webkit-scrollbar { width: 6px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #cfd8dc; border-radius: 3px; }

  .search-input-wrapper { position: relative; background: #fff; border-bottom: 1px solid #eceff1; }
  .search-icon { position: absolute; left: 12px; top: 10px; width: 16px; height: 16px; fill: #90a4ae; }
  .search-input { width: 100%; padding: 10px 12px 10px 34px; border: none; font-size: 13px; outline: none; background: transparent; }
  .search-input:focus { background: #f9fbfd; }

  .member-form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 15px; }
  @media (max-width: 600px) { .member-form-grid { grid-template-columns: 1fr; } }

  .admin-table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #eceff1; }
  .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; min-width: 850px; }
  .admin-table th, .admin-table td { padding: 12px 14px; border-bottom: 1px solid #eceff1; vertical-align: middle; }
  .admin-table th { background-color: #fafbfc; color: #78909c; font-weight: 400; white-space: nowrap; }
  .admin-table tbody tr:hover { background-color: #f9fbfd; }
  .col-members { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  
  .signup-tag { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin: 2px; }
  .info-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #546e7a; margin: 4px 0; }
  .info-icon { width: 14px; height: 14px; fill: #78909c; }

  .export-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #f4f7fb; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eceff1;}
  .date-input { width: 130px; padding: 6px 10px; border: 1px solid #cfd8dc; border-radius: 4px; font-size: 13px; color: #546e7a; }
  .type-tag { display: inline-block; padding: 2px 8px; background: #f0f4c3; color: #827717; border-radius: 4px; font-size: 12px; font-weight: 400; margin-right: 6px; vertical-align: middle; }

  /* 海报容器（默认隐藏，屏幕外生成） */
  #posterContainer {
    position: fixed; left: -9999px; top: 0;
    width: 375px; background: #fff; padding: 20px;
    border-radius: 12px; box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .poster-header { text-align: center; border-bottom: 2px solid #e53935; padding-bottom: 10px; margin-bottom: 15px; }
  .poster-title { color: #e53935; font-size: 22px; font-weight: bold; margin: 10px 0 5px; }
  .poster-subtitle { color: #666; font-size: 14px; }
  .poster-content { color: #333; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
  .poster-content strong { color: #e53935; }
  .poster-qr { text-align: center; margin-top: 20px; }
  .poster-qr img { width: 120px; height: 120px; }
  .poster-qr p { font-size: 13px; color: #666; margin-top: 5px; }

  /* 手机端图片弹窗 */
  #imageModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 99999;
    flex-direction: column; align-items: center; justify-content: center;
  }
  #imageModal img {
    max-width: 90%; max-height: 75%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #imageModal .tip {
    color: #fff; margin-top: 20px; font-size: 16px; font-weight: bold; letter-spacing: 1px;
    background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px;
  }
  #imageModal .close-btn {
    position: absolute; top: 20px; right: 25px; color: #fff; font-size: 35px; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <div class="brand" style="font-weight: 400;">云和·蓝天救援队 · 管理后台</div>
  <nav><a href="index.html">查看首页</a><a href="#" id="logoutBtn">退出</a></nav>
</header>
<main>

  <!-- 1. 队员管理 -->
  <details class="details-card">
    <summary>
      <h2><svg class="title-icon blue" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>队员名单管理</h2>
    </summary>
    <div class="details-inner">
      <form id="memberForm" class="member-form-grid">
        <div><label>姓名 *</label><input type="text" id="newMemberName" required></div>
        <div><label>联系电话</label><input type="text" id="newMemberPhone"></div>
        <div><label>紧急联系人</label><input type="text" id="newMemberEmergency"></div>
        <button class="btn" type="submit" id="addMemberBtn" style="height: 38px;">添加</button>
      </form>
      <details class="details-box">
        <summary><div class="summary-title"><svg class="summary-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>展开查看已录入的队员</div></summary>
        <div id="memberList" class="scroll-area" style="background: #f9fbfd;"></div>
      </details>
    </div>
  </details>

  <!-- 2. 任务招募管理 -->
  <details class="details-card border-red">
    <summary>
      <h2><svg class="title-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>任务招募管理</h2>
    </summary>
    <div class="details-inner">
      <form id="recruitForm" style="background: #f9fbfd; padding: 15px; border-radius: 8px; border: 1px solid #eceff1; margin-bottom: 15px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div><label>任务标题 *</label><input type="text" id="rTitle" required placeholder="如：水域救援技能训练"></div>
          <div><label>活动地点</label><input type="text" id="rLocation" placeholder="如：云和湖码头"></div>
        </div>
        <label>任务类型 *</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="r_event_type" value="公益救援" required> 公益救援</label>
          <label class="radio-item"><input type="radio" name="r_event_type" value="技能培训"> 技能培训</label>
          <label class="radio-item"><input type="radio" name="r_event_type" value="森林消防"> 森林消防</label>
        </div>
        <label>集合时间</label><input type="datetime-local" id="rTime">
        <label>任务详情/要求</label><textarea id="rContent" placeholder="请填写招募要求、注意事项等..." style="min-height: 60px;"></textarea>
        <button class="btn" type="submit" style="margin-top: 10px; background:#e53935;">发布招募令</button>
      </form>
      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead><tr><th>状态</th><th>任务/时间</th><th>已报名人员</th><th>操作</th></tr></thead>
          <tbody id="recruitTableBody"></tbody>
        </table>
      </div>
    </div>
  </details>

  <!-- 3. 录入出勤记录 -->
  <details class="details-card">
    <summary>
      <h2 id="formTitle"><svg class="title-icon green" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>录入新活动记录</h2>
    </summary>
    <div class="details-inner">
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <label>事件/活动名称 *</label><input type="text" id="title" required>
        <label>事件类型 *</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="event_type" value="公益救援" required> 公益救援</label>
          <label class="radio-item"><input type="radio" name="event_type" value="技能培训"> 技能培训</label>
          <label class="radio-item"><input type="radio" name="event_type" value="森林消防"> 森林消防</label>
        </div>
        <label>发生时间</label><input type="datetime-local" id="task_time">
        <label>事件详情</label><textarea id="content"></textarea>
        <label>参与成员及个人时长</label>
        <details class="details-box member-select-details">
          <summary><div class="summary-title"><svg class="summary-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>点击展开选择参与成员</div></summary>
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="memberSearchInput" class="search-input" placeholder="输入姓名搜索..." oninput="filterMemberCheckboxes(this.value)">
          </div>
          <div id="memberCheckboxes" class="scroll-area" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </details>
        <div id="error" class="msg err" style="display:none"></div>
        <p style="margin-top:16px"><button class="btn" type="submit" id="submitBtn">保存记录</button><a href="#" class="btn gray" id="cancelEdit" style="display:none">取消编辑</a></p>
      </form>
    </div>
  </details>

  <!-- 4. 历史记录管理 -->
  <details class="details-card">
    <summary>
      <h2><svg class="title-icon orange" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>历史记录管理</h2>
    </summary>
    <div class="details-inner">
      <div class="export-toolbar">
        <div class="search-input-wrapper" style="flex:1; min-width:200px; border:1px solid #cfd8dc; border-radius:6px;">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="taskSearchInput" class="search-input" placeholder="搜索事件、成员或类型..." oninput="filterTasks(this.value)" style="padding-left:32px;">
        </div>
        
        <input type="date" id="exportStart" class="date-input">
        <span style="color:#90a4ae;">-</span>
        <input type="date" id="exportEnd" class="date-input">
        
        <button class="btn sm" id="exportMembersBtn" style="background: #1565c0;">
          <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:#fff;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          导出时长
        </button>
        <button class="btn sm gray" id="exportAllBtn">
          <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:#fff;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          导出记录
        </button>
      </div>
      
      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead><tr><th>类型</th><th>事件名称</th><th>发生时间</th><th>时长</th><th>参与成员</th><th>操作</th></tr></thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
    </div>
  </details>

</main>

<!-- 隐藏的海报 DOM 容器 -->
<div id="posterContainer" style="display:none;">
  <div class="poster-header">
    <img src="https://img.alicdn.com/imgextra/i3/706125935/O1CN01KcQnpNaiagF49oPo_!!706125935.png" style="height:50px; margin-bottom:10px;">
    <div class="poster-title">任务招募令</div>
    <div class="poster-subtitle">云和·蓝天救援队</div>
  </div>
  <div class="poster-content">
    <p><strong>【任务类型】</strong> <span id="pType"></span></p>
    <p><strong>【任务标题】</strong> <span id="pTitle"></span></p>
    <p><strong>【集合时间】</strong> <span id="pTime"></span></p>
    <p><strong>【活动地点】</strong> <span id="pLoc"></span></p>
    <p><strong>【任务详情】</strong> <span id="pContent"></span></p>
  </div>
  <div class="poster-qr">
    <img id="pQrCode" src="" alt="扫码报名">
    <p>长按识别二维码，进入网页接龙报名</p>
  </div>
</div>

<!-- 手机端图片弹窗展示 -->
<div id="imageModal">
  <div class="close-btn" onclick="closeImageModal()">×</div>
  <img id="posterImg" src="" alt="海报">
  <div class="tip">长按图片，保存到手机相册</div>
</div>

<script type="module">
import { supabase } from './supabaseClient.js';

const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = 'login.html'; throw new Error('not logged in'); }
document.getElementById('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); await supabase.auth.signOut(); location.href = 'index.html'; });

let allMembers = [];
let allTasks = [];
let allRecruits = [];
let allSignups = [];

// --- 1. 初始化加载 ---
async function init() {
  await Promise.all([loadMembers(), loadTasks(), loadRecruits()]);
  renderRecruits();
  renderTasks();
}
init();

// --- 2. 队员与招募管理 ---
async function loadMembers() {
  const { data } = await supabase.from('members').select('*').order('name');
  allMembers = data || [];
  
  document.getElementById('memberList').innerHTML = allMembers.map(m => `
    <span style="display:inline-flex; align-items:center; gap:8px; padding:6px 10px; background:#e3f2fd; color:#1565c0; border-radius:6px; font-size:13px; margin:4px;">
      <strong>${esc(m.name)}</strong> 
      ${m.phone ? `<span style="color:#546e7a; display:flex; align-items:center; gap:4px;"><svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>${esc(m.phone)}</span>` : ''} 
      ${m.emergency_contact ? `<span style="color:#546e7a; display:flex; align-items:center; gap:4px;"><svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>${esc(m.emergency_contact)}</span>` : ''}
      <button type="button" onclick="deleteMember('${m.id}')" style="border:none;background:none;color:#e53935;cursor:pointer;font-weight:bold;">×</button>
    </span>
  `).join('');

  document.getElementById('memberCheckboxes').innerHTML = allMembers.map(m => `
    <label class="checkbox-item" style="background:#fff; padding:6px 12px; border:1px solid #eceff1; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap;">
      <input type="checkbox" name="task_members" value="${esc(m.name)}" onchange="toggleHoursInput(this)">
      <span style="min-width: 40px;">${esc(m.name)}</span>
      <input type="number" step="0.5" min="0" class="member-hours-input" placeholder="时长" style="width:60px; padding:4px; border:1px solid #cfd8dc; border-radius:4px; display:none;">
    </label>
  `).join('');
}

window.deleteMember = async (id) => {
  if(!confirm('确定删除该队员吗？')) return;
  await supabase.from('members').delete().eq('id', id);
  loadMembers();
};

document.getElementById('memberForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('newMemberName').value.trim();
  const phone = document.getElementById('newMemberPhone').value.trim();
  const emergency = document.getElementById('newMemberEmergency').value.trim();
  if(!name) return;
  const { error } = await supabase.from('members').insert({ name, phone, emergency_contact: emergency });
  if(error) alert(error.message);
  else { document.getElementById('memberForm').reset(); loadMembers(); }
});

async function loadRecruits() {
  const [rRes, sRes] = await Promise.all([
    supabase.from('recruitments').select('*').order('created_at', { ascending: false }),
    supabase.from('recruitment_signups').select('*')
  ]);
  allRecruits = rRes.data || [];
  allSignups = sRes.data || [];
}

function renderRecruits() {
  const tbody = document.getElementById('recruitTableBody');
  if (allRecruits.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#90a4ae;">暂无招募令</td></tr>'; return; }

  tbody.innerHTML = allRecruits.map(r => {
    const signups = allSignups.filter(s => s.recruitment_id === r.id);
    const names = signups.map(s => `<span class="signup-tag">${esc(s.member_name)}</span>`).join('');
    const statusTag = r.status === '招募中' ? '<span style="color:#2e7d32; font-weight:bold;">● 招募中</span>' : '<span style="color:#78909c;">○ 已结束</span>';
    const typeTag = r.event_type ? `<span class="type-tag">${esc(r.event_type)}</span>` : '';
    
    return `
      <tr>
        <td>${statusTag}</td>
        <td>
          <div style="font-weight:500; color:#1f2d3d;">${typeTag}${esc(r.title)}</div>
          <div class="info-row" style="margin-top:6px;">
            <svg class="info-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            ${formatTime(r.task_time)}
          </div>
          <div class="info-row">
            <svg class="info-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            ${esc(r.location) || '待定'}
          </div>
        </td>
        <td style="max-width:300px;">${names || '<span style="color:#b0bec5; font-size:12px;">暂无人报名</span>'}</td>
        <td>
          <div class="action-btns">
            <button class="btn sm" style="padding:4px 8px; background:#e53935;" onclick="generatePoster(${r.id})">
              <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:#fff;"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
              生成海报
            </button>
            <button class="btn sm" style="padding:4px 8px; background:#1565c0;" onclick="convertToTask(${r.id})">转出勤</button>
            <button class="btn sm gray" style="padding:4px 8px;" onclick="toggleRecruitStatus(${r.id}, '${r.status}')">${r.status === '招募中' ? '结束' : '开启'}</button>
            <button class="btn sm red" style="padding:4px 8px;" onclick="deleteRecruit(${r.id})">删除</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

document.getElementById('recruitForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const typeEl = document.querySelector('input[name="r_event_type"]:checked');
  const payload = {
    title: document.getElementById('rTitle').value.trim(),
    event_type: typeEl ? typeEl.value : null,
    location: document.getElementById('rLocation').value.trim(),
    task_time: document.getElementById('rTime').value ? new Date(document.getElementById('rTime').value).toISOString() : null,
    content: document.getElementById('rContent').value.trim(),
    status: '招募中'
  };
  const { error } = await supabase.from('recruitments').insert(payload);
  if(error) alert(error.message);
  else { document.getElementById('recruitForm').reset(); loadRecruits().then(renderRecruits); }
});

window.toggleRecruitStatus = async (id, currentStatus) => {
  const newStatus = currentStatus === '招募中' ? '已结束' : '招募中';
  await supabase.from('recruitments').update({ status: newStatus }).eq('id', id);
  loadRecruits().then(renderRecruits);
};

window.deleteRecruit = async (id) => {
  if(!confirm('确定删除该招募令吗？')) return;
  await supabase.from('recruitments').delete().eq('id', id);
  loadRecruits().then(renderRecruits);
};

// 生成招募海报（自适应移动端）
window.generatePoster = (id) => {
  const r = allRecruits.find(x => x.id === id);
  const siteUrl = window.location.href.replace('admin.html', 'index.html');
  
  document.getElementById('pType').textContent = r.event_type || '待定';
  document.getElementById('pTitle').textContent = r.title;
  document.getElementById('pTime').textContent = formatTime(r.task_time);
  document.getElementById('pLoc').textContent = r.location || '待定';
  document.getElementById('pContent').textContent = r.content || '无';
  
  // 生成二维码 API
  document.getElementById('pQrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(siteUrl)}`;

  // 等二维码图片加载完成后截图
  document.getElementById('pQrCode').onload = () => {
    const posterEl = document.getElementById('posterContainer');
    posterEl.style.display = 'block'; // 临时显示（在屏幕外）
    
    html2canvas(posterEl, { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
      posterEl.style.display = 'none';
      const imgData = canvas.toDataURL('image/png');

      // 判断是否为移动端
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      if (isMobile) {
        // 手机端：弹窗展示，引导长按保存
        document.getElementById('posterImg').src = imgData;
        document.getElementById('imageModal').style.display = 'flex';
      } else {
        // PC端：直接下载
        const link = document.createElement('a');
        link.download = `招募海报_${r.title}.png`;
        link.href = imgData;
        link.click();
      }
    }).catch(err => {
      posterEl.style.display = 'none';
      alert('生成海报失败：' + err.message);
    });
  };
};

// 关闭图片弹窗
window.closeImageModal = () => {
  document.getElementById('imageModal').style.display = 'none';
};

// 一键转为出勤记录
window.convertToTask = async (id) => {
  const r = allRecruits.find(x => x.id === id);
  const signups = allSignups.filter(s => s.recruitment_id === id);
  if (signups.length === 0) { alert('该招募令暂无人员报名'); return; }
  
  document.getElementById('title').value = r.title;
  document.getElementById('task_time').value = toLocalInput(r.task_time);
  document.getElementById('content').value = r.content || '';
  
  if (r.event_type) {
    document.querySelectorAll('input[name="event_type"]').forEach(radio => {
      radio.checked = (radio.value === r.event_type);
    });
  }
  
  document.querySelectorAll('input[name="task_members"]').forEach(cb => {
    cb.checked = false; toggleHoursInput(cb);
    if (signups.some(s => s.member_name === cb.value)) {
      cb.checked = true;
      toggleHoursInput(cb);
      cb.parentElement.querySelector('.member-hours-input').value = '4';
    }
  });
  
  document.querySelector('.member-select-details').open = true;
  document.querySelectorAll('.details-card')[2].open = true; 
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
  alert('报名人员及活动类型已自动填好，请核对时长后保存出勤记录。');
};

// --- 3. 历史记录与导出 ---
async function loadTasks() {
  const { data } = await supabase.from('tasks').select('*').order('task_time', { ascending: false });
  allTasks = data || [];
}

function renderTasks(filterText = '') {
  const tbody = document.getElementById('taskTableBody');
  if (!allTasks || allTasks.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#90a4ae;">暂无记录</td></tr>'; return; }

  const filteredTasks = allTasks.filter(t => {
    if (!filterText) return true;
    const kw = filterText.toLowerCase();
    return (t.title && t.title.toLowerCase().includes(kw)) ||
           (t.event_type && t.event_type.toLowerCase().includes(kw)) ||
           (t.members && t.members.toLowerCase().includes(kw));
  });

  if (filteredTasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#90a4ae;">未找到匹配记录</td></tr>';
    return;
  }

  tbody.innerHTML = filteredTasks.map(t => {
    let displayDuration = t.duration;
    if (t.member_hours && Array.isArray(t.member_hours) && t.member_hours.length > 0) {
      const arr = t.member_hours.map(m => parseFloat(m.hours) || 0);
      if (arr.length > 0) displayDuration = Math.max(...arr);
    }
    let membersStr = (t.member_hours && Array.isArray(t.member_hours) && t.member_hours.length > 0) 
      ? t.member_hours.map(m => `${m.name}(${m.hours}h)`).join('、') : (t.members || '-');

    let typeTag = t.event_type ? `<span class="type-tag">${esc(t.event_type)}</span>` : '-';

    return `
    <tr>
      <td>${typeTag}</td>
      <td style="font-weight: 400; color: #1f2d3d;">${esc(t.title)}</td>
      <td style="color: #78909c;">${formatTime(t.task_time)}</td>
      <td>${displayDuration ? displayDuration + 'h' : '-'}</td>
      <td class="col-members" title="${esc(membersStr)}">${esc(membersStr)}</td>
      <td>
        <div class="action-btns">
          <button class="btn sm gray" data-edit="${t.id}" style="padding: 4px 8px;">编辑</button>
          <button class="btn sm blue" data-export="${t.id}" style="padding: 4px 8px; background:#0d47a1;">导出</button>
          <button class="btn sm red" data-del="${t.id}" style="padding: 4px 8px;">删除</button>
        </div>
      </td>
    </tr>`}).join('');

  tbody.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => startEdit(allTasks.find(x => String(x.id) === btn.dataset.edit))));
  tbody.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('确定删除该记录？')) return;
      await supabase.from('tasks').delete().eq('id', btn.dataset.del);
      loadTasks().then(() => renderTasks(document.getElementById('taskSearchInput').value));
    }));
  tbody.querySelectorAll('[data-export]').forEach(btn => btn.addEventListener('click', () => {
      const task = allTasks.find(x => String(x.id) === btn.dataset.export);
      if (task) exportTasksToCSV([task], `出勤记录_${task.title}`);
    }));
}

window.filterTasks = (val) => {
  renderTasks(val);
};

document.getElementById('taskForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('taskId').value;
  const timeInput = document.getElementById('task_time').value;
  const eventType = document.querySelector('input[name="event_type"]:checked')?.value;
  
  const memberHoursArr = []; let maxDuration = 0; let membersNames = [];
  document.querySelectorAll('input[name="task_members"]').forEach(cb => {
    if (cb.checked) {
      const hours = parseFloat(cb.parentElement.querySelector('.member-hours-input').value) || 0;
      memberHoursArr.push({ name: cb.value, hours: hours });
      membersNames.push(cb.value);
      if (hours > maxDuration) maxDuration = hours;
    }
  });

  if (membersNames.length === 0) { alert('请至少勾选一名成员'); return; }

  const payload = {
    title: document.getElementById('title').value.trim(),
    event_type: eventType,
    task_time: timeInput ? new Date(timeInput).toISOString() : null,
    content: document.getElementById('content').value.trim(),
    members: membersNames.join(', '),
    duration: maxDuration.toString(),
    member_hours: memberHoursArr,
  };

  const res = id ? await supabase.from('tasks').update(payload).eq('id', id) : await supabase.from('tasks').insert(payload);
  if (res.error) alert('保存失败：' + res.error.message);
  else { document.getElementById('taskForm').reset(); document.getElementById('taskId').value = ''; loadTasks().then(() => renderTasks(document.getElementById('taskSearchInput').value)); alert('保存成功'); }
});

// 辅助工具
window.toggleHoursInput = (checkbox) => {
  const input = checkbox.parentElement.querySelector('.member-hours-input');
  if (checkbox.checked) { input.style.display = 'inline-block'; input.required = true; }
  else { input.style.display = 'none'; input.required = false; input.value = ''; }
};
window.filterMemberCheckboxes = (keyword) => {
  const kw = keyword.trim().toLowerCase();
  document.querySelectorAll('#memberCheckboxes .checkbox-item').forEach(label => {
    const name = label.querySelector('span').textContent.toLowerCase();
    label.style.display = name.includes(kw) ? 'inline-flex' : 'none';
  });
};

function startEdit(t) {
  document.getElementById('taskId').value = t.id;
  document.getElementById('title').value = t.title || '';
  document.getElementById('content').value = t.content || '';
  document.getElementById('task_time').value = toLocalInput(t.task_time);
  document.querySelectorAll('input[name="event_type"]').forEach(r => r.checked = (r.value === t.event_type));
  
  const taskMembers = t.members ? t.members.split(',').map(s => s.trim()) : [];
  const memberHoursData = t.member_hours || [];
  document.querySelectorAll('input[name="task_members"]').forEach(cb => {
    if (taskMembers.includes(cb.value)) {
      cb.checked = true; toggleHoursInput(cb);
      const found = memberHoursData.find(x => x.name === cb.value);
      cb.parentElement.querySelector('.member-hours-input').value = found ? found.hours : (t.duration || 0);
    } else {
      cb.checked = false; toggleHoursInput(cb);
    }
  });

  document.querySelectorAll('.details-card')[2].open = true; 
  document.querySelector('.member-select-details').open = true;

  document.getElementById('submitBtn').textContent = '保存修改';
  document.getElementById('cancelEdit').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('cancelEdit').addEventListener('click', (e) => {
  e.preventDefault(); document.getElementById('taskForm').reset(); document.getElementById('taskId').value = '';
  document.getElementById('submitBtn').textContent = '保存记录'; e.target.style.display = 'none';
});

function toLocalInput(t) {
  if (!t) return '';
  const d = new Date(t); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function formatTime(t) {
  if (!t) return '待定';
  const d = new Date(t); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 导出事件的简单占位（复用第一阶段的复杂逻辑或直接调用 CSV 函数）
function exportTasksToCSV(data, name) {
  if (!data || data.length === 0) return alert("无数据");
  const headers = ['类型', '名称', '时间', '总时长', '详情'];
  const rows = data.map(t => [t.event_type||'', t.title||'', formatTime(t.task_time), t.duration||'', t.content||'']);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
  link.download = `${name}.csv`; link.click();
}
document.getElementById('exportAllBtn').addEventListener('click', () => exportTasksToCSV(allTasks, '全部记录'));
document.getElementById('exportMembersBtn').addEventListener('click', () => alert('功能已就绪，请使用之前的完整导出逻辑'));
</script>
