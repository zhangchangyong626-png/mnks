<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 云和蓝天救援队</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 300; background: #f4f7fb; color: #333; }
  h2 { font-weight: 400; color: #1f2d3d; margin-bottom: 20px; text-align: center; }
  label { font-weight: 300; color: #607d8b; font-size: 13px; }
  input, button { font-weight: 300; font-family: inherit; }
  .top-nav { position: absolute; right: 20px; top: 20px; font-size: 14px; }
  .top-nav a { color: #607d8b; text-decoration: none; transition: color 0.2s; }
  .top-nav a:hover { color: #1565c0; }
  .login-card { max-width: 400px; margin: 100px auto 0; background: #fff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.04); border: 1px solid #eceff1; }
  .login-card input { width: 100%; padding: 10px 12px; margin-bottom: 15px; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
  .login-card input:focus { outline: none; border-color: #1565c0; }
  .login-card .btn { width: 100%; padding: 10px; font-size: 15px; margin-top: 5px; background: #1565c0; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .login-card .btn:hover { background: #0d47a1; }
  @media (max-width: 600px) { .top-nav { position: static; text-align: center; margin-top: 20px; } .login-card { margin: 20px auto; padding: 30px 20px; } }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html">← 返回首页</a>
</nav>

<div class="login-card">
  <h2>管理员登录</h2>
  <form id="loginForm">
    <label>邮箱</label>
    <input type="email" id="email" required autocomplete="username" placeholder="请输入管理员邮箱">
    <label>密码</label>
    <input type="password" id="password" required autocomplete="current-password" placeholder="请输入密码">
    <div id="error" class="msg err" style="display:none; margin-bottom: 15px; font-weight: 300; color: #e53935;"></div>
    <button class="btn" type="submit" id="submitBtn">登 录</button>
  </form>
</div>

<script type="module">
import { supabase } from './supabaseClient.js';

const { data: { session } } = await supabase.auth.getSession();
if (session) location.href = 'admin.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  
  errEl.style.display = 'none';
  btn.disabled = true; 
  btn.textContent = '登录中…';

  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  });

  if (error) {
    errEl.textContent = '登录失败：' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false; 
    btn.textContent = '登 录';
  } else {
    location.href = 'admin.html';
  }
});
</script>
</body>
</html>
