<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蓝天救援队 · 活动公示</title>
<link rel="stylesheet" href="style.css">
<style>
  details {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    margin-bottom: 16px;
    overflow: hidden;
  }
  summary {
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: #fff;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    transition: background 0.2s;
  }
  summary:hover { background: #f9fbfd; }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: '▼';
    font-size: 12px;
    color: #90a4ae;
    transition: transform 0.3s ease;
  }
  details[open] summary::after { transform: rotate(180deg); }
  details[open] summary { border-bottom: 1px solid #eceff1; }
  .details-content { padding: 10px; }
  
  /* 排行榜表格重新设计，完美适配手机 */
  .stats-table { 
    width: 100%; 
    border-collapse: collapse; 
    font-size: 15px; 
    text-align: center; 
  }
  .stats-table th, .stats-table td { 
    padding: 14px 8px; 
    border-bottom: 1px solid #eceff1; 
  }
  .stats-table th { color: #607d8b; font-weight: 600; background: #f9fbfd; }
  
  /* 姓名列左对齐，并加入点击手势 */
  .stats-table td:nth-child(2) { text-align: left; }
  .clickable-name { 
    cursor: pointer; 
    color: #1565c0; 
    font-weight: 600; 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
  }
  
  /* 展开箭头动画 */
  .arrow { 
    font-size: 10px; 
    color: #90a4ae; 
    transition: transform 0.3s ease; 
  }
  .arrow.open { transform: rotate(180deg); }

  .rank { font-weight: bold; color: #1565c0; width: 50px;}
  .rank-1 { color: #f57f17; font-size: 18px; }
  .rank-2 { color: #78909c; font-size: 18px; }
  .rank-3 { color: #8d6e63; font-size: 18px; }
  
  .total-col { font-weight: bold; color: #1565c0; }

  /* 展开后的详情行样式 */
  .details-row td {
    background: #f4f7fb;
    padding: 12px 15px;
    border-bottom: 1px solid #eceff1;
  }
  .details-flex {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .detail-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    background: #fff;
    border: 1px solid #cfd8dc;
    color: #546e7a;
  }
  .detail-badge.rescue { border-color: #90caf9; color: #1565c0; }
  .detail-badge.training { border-color: #a5d6a7; color: #2e7d32; }
  .detail-badge.fire { border-color: #ef9a9a; color: #c62828; }

  .type-tag {
    display: inline-block; padding: 2px 8px; background: #e3f2fd; color: #1565c0;
    border-radius: 4px; font-size: 12px; font-weight: normal; margin-right: 8px; vertical-align: middle;
  }

  @media (max-width: 600px) {
    .details-content { padding: 5px; }
    .stats-table th, .stats-table td { padding: 12px 4px; font-size: 14px; }
    .stats-table .rank { width: 40px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">蓝天救援队 · 活动公示</div>
  <nav id="nav">
    <a href="login.html">管理员登录</a>
  </nav>
</header>
<main>
  
  <div id="loading" class="empty">加载中…</div>

  <details id="statsPanel" style="display:none;">
    <summary>🏆 队员出勤总时长排行榜</summary>
    <div class="details-content" id="statsBox"></div>
  </details>

  <details id="tasksPanel" style="display:none;">
    <summary>📋 历史活动记录公示</summary>
    <div class="details-content" id="taskList"></div>
  </details>

  <div id="emptyState" class="empty" style="display:none">暂无活动记录</div>
</main>
<footer>蓝天救援队 · 活动公示</footer>

<script type="module">
import { supabase } from './supabaseClient.js';

const { data: { session } } = await supabase.auth.getSession();
const nav = document.getElementById('nav');
if (session) {
  nav.innerHTML = `<a href="admin.html">管理后台</a><a href="#" id="logoutBtn">退出</a>`;
  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    location.reload();
  });
}

const { data: tasks, error } = await supabase
  .from('tasks')
  .select('*')
  .order('task_time', { ascending: false });

document.getElementById('loading').style.display = 'none';

if (error) {
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('emptyState').innerHTML = `<div class="msg err">加载失败：${esc(error.message)}</div>`;
} else if (!tasks || tasks.length === 0) {
  document.getElementById('emptyState').style.display = 'block';
} else {
  document.getElementById('statsPanel').style.display = 'block';
  document.getElementById('tasksPanel').style.display = 'block';

  document.getElementById('taskList').innerHTML = tasks.map(t => {
    let membersHtml = '';
    if (t.member_hours && Array.isArray(t.member_hours) && t.member_hours.length > 0) {
      membersHtml = t.member_hours.map(m => `${esc(m.name)}(${m.hours}h)`).join('、');
    } else {
      membersHtml = esc(t.members).replace(/\n/g, '、');
    }

    let displayDuration = t.duration;
    if (t.member_hours && Array.isArray(t.member_hours) && t.member_hours.length > 0) {
      const arr = t.member_hours.map(m => parseFloat(m.hours) || 0);
      if (arr.length > 0) displayDuration = Math.max(...arr);
    }

    return `
      <article class="card" style="box-shadow:none; border:1px solid #eceff1; margin-bottom:12px;">
        <h2 style="font-size:16px; margin-bottom:8px;">
          ${t.event_type ? `<span class="type-tag">${esc(t.event_type)}</span>` : ''}
          ${esc(t.title)}
        </h2>
        <div class="meta">
          活动时间：${formatTime(t.task_time)} 
          ${displayDuration ? ` · 任务时长：${esc(displayDuration)} 小时` : ''}
        </div>
        ${t.content ? `<div class="content">${esc(t.content)}</div>` : ''}
        ${membersHtml ? `<div class="members"><strong>参与成员：</strong>${membersHtml}</div>` : ''}
      </article>
    `;
  }).join('');

  renderStats(tasks);
}

function renderStats(tasks) {
  const statsBox = document.getElementById('statsBox');
  const memberStats = {};

  tasks.forEach(t => {
    const type = t.event_type || ''; 
    
    if (t.member_hours && Array.isArray(t.member_hours) && t.member_hours.length > 0) {
      t.member_hours.forEach(m => {
        const hours = parseFloat(m.hours) || 0;
        if (hours > 0 && m.name) {
          if (!memberStats[m.name]) memberStats[m.name] = { rescue: 0, training: 0, fire: 0, total: 0 };
          
          memberStats[m.name].total += hours;
          if (type === '公益救援') memberStats[m.name].rescue += hours;
          else if (type === '技能培训') memberStats[m.name].training += hours;
          else if (type === '森林消防') memberStats[m.name].fire += hours;
        }
      });
    } 
    else if (t.members && t.duration) {
      const hours = parseFloat(String(t.duration).replace(/[^\d.]/g, '')) || 0;
      const membersArray = t.members.split(/[,，\s]+/).filter(Boolean);
      
      membersArray.forEach(name => {
        if (!memberStats[name]) memberStats[name] = { rescue: 0, training: 0, fire: 0, total: 0 };
        memberStats[name].total += hours;
        if (type === '公益救援') memberStats[name].rescue += hours;
        else if (type === '技能培训') memberStats[name].training += hours;
        else if (type === '森林消防') memberStats[name].fire += hours;
      });
    }
  });

  const sortedMembers = Object.entries(memberStats).sort((a, b) => b[1].total - a[1].total);

  if (sortedMembers.length === 0) {
    statsBox.innerHTML = '<div class="empty">暂无时长记录</div>';
    return;
  }

  const fmt = (num) => parseFloat(num.toFixed(1));

  // 生成极简的表格（只有排名、姓名、总时长），点击姓名展开明细
  statsBox.innerHTML = `
    <table class="stats-table">
      <thead>
        <tr>
          <th class="rank">排名</th>
          <th>队员姓名</th>
          <th>总时长</th>
        </tr>
      </thead>
      <tbody>
        ${sortedMembers.map((item, index) => {
          const name = item[0];
          const data = item[1];
          
          let rankClass = '';
          if (index === 0) rankClass = 'rank-1';
          else if (index === 1) rankClass = 'rank-2';
          else if (index === 2) rankClass = 'rank-3';
          
          // 生成详情徽章
          let detailsHtml = '';
          if (data.rescue > 0) detailsHtml += `<span class="detail-badge rescue">公益救援：${fmt(data.rescue)}h</span>`;
          if (data.training > 0) detailsHtml += `<span class="detail-badge training">技能培训：${fmt(data.training)}h</span>`;
          if (data.fire > 0) detailsHtml += `<span class="detail-badge fire">森林消防：${fmt(data.fire)}h</span>`;
          if (detailsHtml === '') detailsHtml = '<span class="detail-badge">暂无分类明细</span>';

          return `
            <tr>
              <td class="rank ${rankClass}">${index + 1}</td>
              <td>
                <span class="clickable-name" onclick="toggleDetail('detail-${index}', this)">
                  ${esc(name)} <span class="arrow">▼</span>
                </span>
              </td>
              <td class="total-col">${fmt(data.total)} 小时</td>
            </tr>
            <tr id="detail-${index}" class="details-row" style="display: none;">
              <td colspan="3">
                <div class="details-flex">
                  ${detailsHtml}
                </div>
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

// 全局点击展开/收起逻辑
window.toggleDetail = (detailId, nameElement) => {
  const detailRow = document.getElementById(detailId);
  const arrow = nameElement.querySelector('.arrow');
  
  if (detailRow.style.display === 'none') {
    detailRow.style.display = 'table-row';
    arrow.classList.add('open');
  } else {
    detailRow.style.display = 'none';
    arrow.classList.remove('open');
  }
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(t) {
  if (!t) return '待定';
  const d = new Date(t);
  if (isNaN(d)) return t;
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
</script>
</body>
</html>
