<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 蓝天救援队</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">蓝天救援队 · 任务公示</div>
  <nav><a href="index.html">返回首页</a></nav>
</header>
<main>
  <div class="card login-card">
    <h2>管理员登录</h2>
    <form id="loginForm">
      <label>邮箱</label>
      <input type="email" id="email" required autocomplete="username">
      <label>密码</label>
      <input type="password" id="password" required autocomplete="current-password">
      <div id="error" class="msg err" style="display:none"></div>
      <p style="margin-top:16px">
        <button class="btn" type="submit" id="submitBtn">登录</button>
      </p>
    </form>
  </div>
</main>
<script type="module">
import { supabase } from './supabaseClient.js';

const { data: { session } } = await supabase.auth.getSession();
if (session) location.href = 'admin.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = '登录中…';

  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  });

  if (error) {
    errEl.textContent = '登录失败：' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '登录';
  } else {
    location.href = 'admin.html';
  }
});
</script>
</body>
</html>
