<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云和蓝天救援队 · 任务公示</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 折叠面板的样式 */
  details {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    margin-bottom: 16px;
    overflow: hidden;
  }
  summary {
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: #fff;
    list-style: none; /* 隐藏默认的小三角 */
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    transition: background 0.2s;
  }
  summary:hover { background: #f9fbfd; }
  summary::-webkit-details-marker { display: none; } /* 隐藏 Safari 默认的三角 */
  
  /* 自定义右侧箭头图标 */
  summary::after {
    content: '▼';
    font-size: 12px;
    color: #90a4ae;
    transition: transform 0.3s ease;
  }
  details[open] summary::after {
    transform: rotate(180deg);
  }
  details[open] summary {
    border-bottom: 1px solid #eceff1;
  }
  
  /* 内部内容区样式 */
  .details-content {
    padding: 18px;
  }
  
  /* 统计表格样式 */
  .stats-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .stats-table th, .stats-table td { padding: 10px; border-bottom: 1px solid #eceff1; text-align: left; }
  .stats-table th { color: #607d8b; font-weight: 600; }
  .stats-table tr:hover { background: #f4f7fb; }
  .rank { font-weight: bold; color: #1565c0; width: 40px; text-align: center;}
  
  /* 前三名特殊颜色 */
  .rank-1 { color: #f57f17; font-size: 16px; }
  .rank-2 { color: #78909c; font-size: 16px; }
  .rank-3 { color: #8d6e63; font-size: 16px; }
</style>
</head>
<body>
<header>
  <div class="brand">蓝天救援队 · 任务公示</div>
  <nav id="nav">
    <a href="login.html">管理员登录</a>
  </nav>
</header>
<main>
  
  <div id="loading" class="empty">加载中…</div>

  <!-- 出勤统计折叠面板 -->
  <details id="statsPanel" style="display:none;">
    <summary>🏆 队员出勤总时长排行榜</summary>
    <div class="details-content" id="statsBox"></div>
  </details>

  <!-- 任务列表折叠面板 -->
  <details id="tasksPanel" style="display:none;">
    <summary>📋 任务公示列表</summary>
    <div class="details-content" id="taskList"></div>
  </details>

  <div id="emptyState" class="empty" style="display:none">暂无任务</div>
</main>
<footer>蓝天救援队 · 任务公示</footer>

<script type="module">
import { supabase } from './supabaseClient.js';

// 1. 登录状态判断
const { data: { session } } = await supabase.auth.getSession();
const nav = document.getElementById('nav');
if (session) {
  nav.innerHTML = `<a href="admin.html">管理后台</a><a href="#" id="logoutBtn">退出</a>`;
  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    location.reload();
  });
}

// 2. 获取任务数据
const { data: tasks, error } = await supabase
  .from('tasks')
  .select('*')
  .order('task_time', { ascending: false });

document.getElementById('loading').style.display = 'none';

if (error) {
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('emptyState').innerHTML = `<div class="msg err">加载失败：${esc(error.message)}</div>`;
} else if (!tasks || tasks.length === 0) {
  document.getElementById('emptyState').style.display = 'block';
} else {
  // 显示折叠面板
  document.getElementById('statsPanel').style.display = 'block';
  document.getElementById('tasksPanel').style.display = 'block';

  // 3. 渲染任务列表
  document.getElementById('taskList').innerHTML = tasks.map(t => `
    <article class="card" style="box-shadow:none; border:1px solid #eceff1; margin-bottom:12px;">
      <h2 style="font-size:16px; margin-bottom:8px;">${esc(t.title)}</h2>
      <div class="meta">
        任务时间：${formatTime(t.task_time)} 
        ${t.duration ? ` · 任务时长：${esc(t.duration)} 小时` : ''}
      </div>
      ${t.content ? `<div class="content">${esc(t.content)}</div>` : ''}
      ${t.members ? `<div class="members"><strong>参与成员：</strong>${esc(t.members).replace(/\n/g, '、')}</div>` : ''}
    </article>
  `).join('');

  // 4. 计算并渲染出勤统计
  renderStats(tasks);
}

function renderStats(tasks) {
  const statsBox = document.getElementById('statsBox');
  const memberHours = {}; // 用来记录每个人的总时长

  tasks.forEach(t => {
    // 从文本中提取数字
    const hours = parseFloat(String(t.duration).replace(/[^\d.]/g, '')) || 0;
    
    if (hours > 0 && t.members) {
      const membersArray = t.members.split(/[,，\s]+/).filter(Boolean);
      
      membersArray.forEach(name => {
        if (memberHours[name]) {
          memberHours[name] += hours;
        } else {
          memberHours[name] = hours;
        }
      });
    }
  });

  // 按总时长降序排序（从高到低）
  const sortedMembers = Object.entries(memberHours).sort((a, b) => b[1] - a[1]);

  if (sortedMembers.length === 0) {
    statsBox.innerHTML = '<div class="empty">暂无时长记录</div>';
    return;
  }

  // 生成表格
  statsBox.innerHTML = `
    <table class="stats-table">
      <thead>
        <tr>
          <th class="rank">排名</th>
          <th>队员姓名</th>
          <th style="text-align:right;">累计出勤时长</th>
        </tr>
      </thead>
      <tbody>
        ${sortedMembers.map((item, index) => {
          let rankClass = '';
          if (index === 0) rankClass = 'rank-1';
          else if (index === 1) rankClass = 'rank-2';
          else if (index === 2) rankClass = 'rank-3';
          
          return `
            <tr>
              <td class="rank ${rankClass}">${index + 1}</td>
              <td style="${index < 3 ? 'font-weight:bold;' : ''}">${esc(item[0])}</td>
              <td style="text-align:right; font-weight:bold; color:#1565c0;">${item[1]} 小时</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

// 辅助函数
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(t) {
  if (!t) return '待定';
  const d = new Date(t);
  if (isNaN(d)) return t;
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
</script>
</body>
</html>
