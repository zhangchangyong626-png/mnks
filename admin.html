<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 蓝天救援队</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 补充一点勾选框的样式 */
  .checkbox-group {
    display: flex; flex-wrap: wrap; gap: 12px;
    background: #f9fbfd; padding: 12px; border-radius: 6px; border: 1px solid #cfd8dc;
  }
  .checkbox-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; color: #1f2d3d; cursor: pointer; margin: 0;
  }
  .checkbox-item input { width: auto; margin: 0; cursor: pointer; }
  .member-tag {
    display: inline-block; padding: 4px 8px; background: #e3f2fd; color: #1565c0;
    border-radius: 4px; font-size: 13px; margin: 4px;
  }
  .member-tag button { border: none; background: none; color: #e53935; cursor: pointer; margin-left: 4px; font-weight: bold; }
</style>
</head>
<body>
<header>
  <div class="brand">蓝天救援队 · 管理后台</div>
  <nav>
    <a href="index.html">查看首页</a>
    <a href="#" id="logoutBtn">退出</a>
  </nav>
</header>
<main>
  
  <!-- 队员名单管理区 -->
  <div class="card">
    <h2>队员名单管理</h2>
    <form id="memberForm" style="display:flex; gap:10px; align-items:flex-end; margin-bottom:15px;">
      <div style="flex:1;">
        <label>新增队员名字</label>
        <input type="text" id="newMemberName" placeholder="请输入队员名字" required>
      </div>
      <button class="btn" type="submit" id="addMemberBtn">添加</button>
    </form>
    <div id="memberList" style="margin-top:10px;">加载名单中...</div>
  </div>

  <!-- 任务发布区 -->
  <div class="card">
    <h2 id="formTitle">发布新任务</h2>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <label>任务标题 *</label>
      <input type="text" id="title" required>

      <label>任务时间</label>
      <input type="datetime-local" id="task_time">

      <label>任务内容</label>
      <textarea id="content" placeholder="任务详情、地点、注意事项等"></textarea>

      <label>参与成员（勾选）</label>
      <div id="memberCheckboxes" class="checkbox-group">
        <!-- 动态生成勾选框 -->
      </div>

      <label>本次任务时长（例如：4小时、半天等）</label>
      <input type="text" id="duration" placeholder="例如：4小时">

      <div id="error" class="msg err" style="display:none"></div>
      <p style="margin-top:16px">
        <button class="btn" type="submit" id="submitBtn">发布任务</button>
        <a href="#" class="btn gray" id="cancelEdit" style="display:none">取消编辑</a>
      </p>
    </form>
  </div>

  <!-- 任务列表区 -->
  <div class="card">
    <h2>已发布任务</h2>
    <div id="taskList"></div>
  </div>
</main>

<script type="module">
import { supabase } from './supabaseClient.js';

const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = 'login.html'; throw new Error('not logged in'); }

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  location.href = 'index.html';
});

// --- 队员管理逻辑 ---
let allMembers = [];

async function loadMembers() {
  const { data, error } = await supabase.from('members').select('*').order('name');
  const box = document.getElementById('memberList');
  const checkboxGroup = document.getElementById('memberCheckboxes');

  if (error) {
    box.innerHTML = `<div class="msg err">名单加载失败：${error.message}</div>`;
    return;
  }

  allMembers = data || [];
  
  // 1. 渲染下方的列表（带删除按钮）
  if (allMembers.length === 0) {
    box.innerHTML = '<span class="empty">暂无队员，请在上方添加</span>';
  } else {
    box.innerHTML = allMembers.map(m => `
      <span class="member-tag">
        ${esc(m.name)}
        <button type="button" onclick="deleteMember('${m.id}')" title="删除">×</button>
      </span>
    `).join('');
  }

  // 2. 渲染发布任务表单里的勾选框
  if (allMembers.length === 0) {
    checkboxGroup.innerHTML = '<span style="color:#90a4ae;font-size:13px;">请先在上方添加队员名单</span>';
  } else {
    checkboxGroup.innerHTML = allMembers.map(m => `
      <label class="checkbox-item">
        <input type="checkbox" name="task_members" value="${esc(m.name)}">
        ${esc(m.name)}
      </label>
    `).join('');
  }
}

// 全局暴露删除函数
window.deleteMember = async (id) => {
  if(!confirm('确定删除该队员吗？')) return;
  const { error } = await supabase.from('members').delete().eq('id', id);
  if(error) alert('删除失败：' + error.message);
  else loadMembers();
};

document.getElementById('memberForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('newMemberName').value.trim();
  if(!name) return;
  
  const btn = document.getElementById('addMemberBtn');
  btn.disabled = true;
  
  const { error } = await supabase.from('members').insert({ name });
  btn.disabled = false;
  
  if(error) {
    alert('添加失败（可能是名字重复）：' + error.message);
  } else {
    document.getElementById('newMemberName').value = '';
    loadMembers();
  }
});

// --- 任务发布逻辑 ---

const form = document.getElementById('taskForm');
const taskIdEl = document.getElementById('taskId');
const formTitle = document.getElementById('formTitle');
const submitBtn = document.getElementById('submitBtn');
const cancelEdit = document.getElementById('cancelEdit');
const errorEl = document.getElementById('error');

let allTasks = [];

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}
function resetForm() {
  form.reset();
  taskIdEl.value = '';
  formTitle.textContent = '发布新任务';
  submitBtn.textContent = '发布任务';
  cancelEdit.style.display = 'none';
  errorEl.style.display = 'none';
  // 清空所有勾选框
  document.querySelectorAll('input[name="task_members"]').forEach(cb => cb.checked = false);
}
cancelEdit.addEventListener('click', (e) => { e.preventDefault(); resetForm(); });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.style.display = 'none';

  const id = taskIdEl.value;
  const timeInput = document.getElementById('task_time').value;
  
  // 获取所有被勾选的成员名字，用逗号拼接
  const selectedMembers = Array.from(document.querySelectorAll('input[name="task_members"]:checked'))
    .map(cb => cb.value)
    .join(', ');

  const payload = {
    title: document.getElementById('title').value.trim(),
    task_time: timeInput ? new Date(timeInput).toISOString() : null,
    content: document.getElementById('content').value.trim(),
    members: selectedMembers, 
    duration: document.getElementById('duration').value.trim(),
  };
  if (!payload.title) { showError('请填写任务标题'); return; }

  submitBtn.disabled = true;
  const res = id
    ? await supabase.from('tasks').update(payload).eq('id', id)
    : await supabase.from('tasks').insert(payload);
  submitBtn.disabled = false;

  if (res.error) { showError('保存失败：' + res.error.message); return; }
  resetForm();
  loadTasks();
});

async function loadTasks() {
  const { data, error } = await supabase
    .from('tasks').select('*').order('task_time', { ascending: false });
  const box = document.getElementById('taskList');

  if (error) { box.innerHTML = `<div class="msg err">加载失败：${esc(error.message)}</div>`; return; }
  allTasks = data || [];
  if (allTasks.length === 0) { box.innerHTML = '<div class="empty">暂无任务</div>'; return; }

  box.innerHTML = allTasks.map(t => `
    <div class="task-row">
      <div>
        <div class="t">${esc(t.title)}</div>
        <div class="meta">
          ${formatTime(t.task_time)}
          ${t.duration ? ' · 时长: ' + esc(t.duration) : ''}
          ${t.members ? ' · 参与: ' + esc(t.members) : ''}
        </div>
      </div>
      <div class="actions">
        <button class="btn sm gray" data-edit="${t.id}">编辑</button>
        <button class="btn sm red" data-del="${t.id}">删除</button>
      </div>
    </div>
  `).join('');

  box.querySelectorAll('[data-edit]').forEach(btn =>
    btn.addEventListener('click', () =>
      startEdit(allTasks.find(x => String(x.id) === btn.dataset.edit))));
  box.querySelectorAll('[data-del]').forEach(btn =>
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除该任务？')) return;
      const { error } = await supabase.from('tasks').delete().eq('id', btn.dataset.del);
      if (error) { alert('删除失败：' + error.message); return; }
      loadTasks();
    }));
}

function startEdit(t) {
  if (!t) return;
  taskIdEl.value = t.id;
  document.getElementById('title').value = t.title || '';
  document.getElementById('content').value = t.content || '';
  document.getElementById('duration').value = t.duration || '';
  document.getElementById('task_time').value = toLocalInput(t.task_time);
  
  // 回显勾选框
  const taskMembers = t.members ? t.members.split(',').map(s => s.trim()) : [];
  document.querySelectorAll('input[name="task_members"]').forEach(cb => {
    cb.checked = taskMembers.includes(cb.value);
  });

  formTitle.textContent = '编辑任务';
  submitBtn.textContent = '保存修改';
  cancelEdit.style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function toLocalInput(t) {
  if (!t) return '';
  const d = new Date(t);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function formatTime(t) {
  if (!t) return '时间待定';
  const d = new Date(t);
  if (isNaN(d)) return d.toISOString();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 初始化加载
loadMembers();
loadTasks();
</script>
</body>
</html>
