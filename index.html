<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蓝天救援队 · 任务公示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">蓝天救援队 · 任务公示</div>
  <nav id="nav">
    <a href="login.html">管理员登录</a>
  </nav>
</header>
<main>
  <div id="loading" class="empty">加载中…</div>
  <div id="taskList"></div>
  <div id="emptyState" class="empty" style="display:none">暂无任务</div>
</main>
<footer>蓝天救援队 · 任务公示</footer>

<script type="module">
import { supabase } from './supabaseClient.js';

const { data: { session } } = await supabase.auth.getSession();
const nav = document.getElementById('nav');
if (session) {
  nav.innerHTML = `<a href="admin.html">管理后台</a><a href="#" id="logoutBtn">退出</a>`;
  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    location.reload();
  });
}

const { data: tasks, error } = await supabase
  .from('tasks')
  .select('*')
  .order('task_time', { ascending: false });

document.getElementById('loading').style.display = 'none';

if (error) {
  document.getElementById('taskList').innerHTML =
    `<div class="msg err">加载失败：${esc(error.message)}</div>`;
} else if (!tasks || tasks.length === 0) {
  document.getElementById('emptyState').style.display = 'block';
} else {
  document.getElementById('taskList').innerHTML = tasks.map(t => `
    <article class="card">
      <h2>${esc(t.title)}</h2>
      <div class="meta">
        任务时间：${formatTime(t.task_time)} 
        ${t.duration ? ` · 任务时长：${esc(t.duration)}` : ''}
      </div>
      ${t.content ? `<div class="content">${esc(t.content)}</div>` : ''}
      ${t.members ? `<div class="members"><strong>参与成员：</strong>${esc(t.members).replace(/\n/g, '、')}</div>` : ''}
    </article>
  `).join('');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(t) {
  if (!t) return '待定';
  const d = new Date(t);
  if (isNaN(d)) return t;
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
</script>
</body>
</html>
