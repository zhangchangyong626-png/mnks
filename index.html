<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蓝天救援队 · 活动公示</title>
<link rel="stylesheet" href="style.css">
<style>
  details {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    margin-bottom: 16px;
    overflow: hidden;
  }
  summary {
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: #fff;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    transition: background 0.2s;
  }
  summary:hover { background: #f9fbfd; }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: '▼';
    font-size: 12px;
    color: #90a4ae;
    transition: transform 0.3s ease;
  }
  details[open] summary::after { transform: rotate(180deg); }
  details[open] summary { border-bottom: 1px solid #eceff1; }
  .details-content { padding: 18px; }
  
  /* 表格样式优化，适配多列 */
  .stats-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
  .stats-table th, .stats-table td { padding: 10px 6px; border-bottom: 1px solid #eceff1; }
  .stats-table th { color: #607d8b; font-weight: 600; background: #f9fbfd; }
  .stats-table tr:hover { background: #f4f7fb; }
  .stats-table td:nth-child(2) { text-align: left; } /* 姓名左对齐 */
  
  .rank { font-weight: bold; color: #1565c0; width: 40px;}
  .rank-1 { color: #f57f17; font-size: 16px; }
  .rank-2 { color: #78909c; font-size: 16px; }
  .rank-3 { color: #8d6e63; font-size: 16px; }
  
  .total-col { font-weight: bold; color: #1565c0; background: #f4f7fb; }
  
  /* 手机端让表格可以横向滑动，防止挤压 */
  .table-wrapper { width: 100%; overflow-x: auto; }

  .type-tag {
    display: inline-block; padding: 2px 8px; background: #e3f2fd; color: #1565c0;
    border-radius: 4px; font-size: 12px; font-weight: normal; margin-right: 8px; vertical-align: middle;
  }
</style>
</head>
<body>
<header>
  <div class="brand">蓝天救援队 · 活动公示</div>
  <nav id="nav">
    <a href="login.html">管理员登录</a>
  </nav>
</header>
<main>
  
  <div id="loading" class="empty">加载中…</div>

  <!-- 出勤统计折叠面板 -->
  <details id="statsPanel" style="display:none;">
    <summary>🏆 队员出勤总时长排行榜</summary>
    <div class="details-content" id="statsBox"></div>
  </details>

  <!-- 活动记录折叠面板 -->
  <details id="tasksPanel" style="display:none;">
    <summary>📋 历史活动记录公示</summary>
    <div class="details-content" id="taskList"></div>
  </details>

  <div id="emptyState" class="empty" style="display:none">暂无活动记录</div>
</main>
<footer>蓝天救援队 · 活动公示</footer>

<script type="module">
import { supabase } from './supabaseClient.js';

const { data: { session } } = await supabase.auth.getSession();
const nav = document.getElementById('nav');
if (session) {
  nav.innerHTML = `<a href="admin.html">管理后台</a><a href="#" id="logoutBtn">退出</a>`;
  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    location.reload();
  });
}

const { data: tasks, error } = await supabase
  .from('tasks')
  .select('*')
  .order('task_time', { ascending: false });

document.getElementById('loading').style.display = 'none';

if (error) {
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('emptyState').innerHTML = `<div class="msg err">加载失败：${esc(error.message)}</div>`;
} else if (!tasks || tasks.length === 0) {
  document.getElementById('emptyState').style.display = 'block';
} else {
  document.getElementById('statsPanel').style.display = 'block';
  document.getElementById('tasksPanel').style.display = 'block';

  // 渲染记录列表
  document.getElementById('taskList').innerHTML = tasks.map(t => `
    <article class="card" style="box-shadow:none; border:1px solid #eceff1; margin-bottom:12px;">
      <h2 style="font-size:16px; margin-bottom:8px;">
        ${t.event_type ? `<span class="type-tag">${esc(t.event_type)}</span>` : ''}
        ${esc(t.title)}
      </h2>
      <div class="meta">
        活动时间：${formatTime(t.task_time)} 
        ${t.duration ? ` · 出勤时长：${esc(t.duration)} 小时` : ''}
      </div>
      ${t.content ? `<div class="content">${esc(t.content)}</div>` : ''}
      ${t.members ? `<div class="members"><strong>参与成员：</strong>${esc(t.members).replace(/\n/g, '、')}</div>` : ''}
    </article>
  `).join('');

  renderStats(tasks);
}

function renderStats(tasks) {
  const statsBox = document.getElementById('statsBox');
  
  // 记录每个人的详细数据
  // 结构: { '张三': { rescue: 0, training: 0, fire: 0, total: 0 } }
  const memberStats = {};

  tasks.forEach(t => {
    // 提取纯数字时长
    const hours = parseFloat(String(t.duration).replace(/[^\d.]/g, '')) || 0;
    const type = t.event_type || ''; 
    
    if (hours > 0 && t.members) {
      const membersArray = t.members.split(/[,，\s]+/).filter(Boolean);
      
      membersArray.forEach(name => {
        if (!memberStats[name]) {
          memberStats[name] = { rescue: 0, training: 0, fire: 0, total: 0 };
        }
        
        // 累加总时长
        memberStats[name].total += hours;
        
        // 按类型累加细分时长
        if (type === '公益救援') memberStats[name].rescue += hours;
        else if (type === '技能培训') memberStats[name].training += hours;
        else if (type === '森林消防') memberStats[name].fire += hours;
      });
    }
  });

  // 转换为数组并按总时长降序排序
  const sortedMembers = Object.entries(memberStats).sort((a, b) => b[1].total - a[1].total);

  if (sortedMembers.length === 0) {
    statsBox.innerHTML = '<div class="empty">暂无时长记录</div>';
    return;
  }

  // 格式化数字，去掉多余的0 (比如 4.0 -> 4, 4.50 -> 4.5)
  const fmt = (num) => parseFloat(num.toFixed(1));

  // 生成表格
  statsBox.innerHTML = `
    <div class="table-wrapper">
      <table class="stats-table">
        <thead>
          <tr>
            <th class="rank">排名</th>
            <th>队员姓名</th>
            <th>公益救援</th>
            <th>技能培训</th>
            <th>森林消防</th>
            <th class="total-col">总时长</th>
          </tr>
        </thead>
        <tbody>
          ${sortedMembers.map((item, index) => {
            const name = item[0];
            const data = item[1];
            
            let rankClass = '';
            if (index === 0) rankClass = 'rank-1';
            else if (index === 1) rankClass = 'rank-2';
            else if (index === 2) rankClass = 'rank-3';
            
            return `
              <tr>
                <td class="rank ${rankClass}">${index + 1}</td>
                <td style="${index < 3 ? 'font-weight:bold;' : ''}">${esc(name)}</td>
                <td>${data.rescue > 0 ? fmt(data.rescue) : '-'}</td>
                <td>${data.training > 0 ? fmt(data.training) : '-'}</td>
                <td>${data.fire > 0 ? fmt(data.fire) : '-'}</td>
                <td class="total-col">${fmt(data.total)} 小时</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(t) {
  if (!t) return '待定';
  const d = new Date(t);
  if (isNaN(d)) return t;
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
</script>
</body>
</html>
