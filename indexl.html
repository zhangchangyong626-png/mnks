<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>森林消防 · 学习系统</title>
    <style>
        /* ---------- 全局 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Segoe UI', Roboto, system-ui, sans-serif;
            font-weight: 300;
            letter-spacing: 0.04em;
            background: #f2f4f8;
            color: #1f2a36;
            padding: 12px 8px 80px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ---------- 页面容器 ---------- */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ---------- 通用头部 ---------- */
        .header {
            background: rgba(30, 58, 95, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-weight: 300;
            font-size: 22px;
            letter-spacing: 0.12em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1::before {
            content: "";
            display: inline-block;
            width: 28px;
            height: 28px;
            background-image: url("https://img.alicdn.com/imgextra/i3/706125935/O1CN01CrYVGjp8qJL0CaUK_!!706125935.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
        }

        .header .sub {
            font-size: 12px;
            opacity: 0.85;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-weight: 300;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.9);
        }

        .header .sub span {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
        }

        .header .btn-back {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 300;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            letter-spacing: 0.04em;
        }
        .header .btn-back:hover {
            background: rgba(255, 255, 255, 0.22);
        }
        .header .btn-back:active {
            transform: scale(0.95);
        }

        /* ---------- 主页按钮 ---------- */
        .home-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 400px;
            margin: 40px auto;
        }

        .home-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            padding: 40px 20px;
            text-decoration: none;
            color: #1e3a5f;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .home-btn:active {
            transform: scale(0.96);
        }
        .home-btn .icon {
            font-size: 42px;
            margin-bottom: 12px;
            font-weight: 300;
        }
        .home-btn .label {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 0.06em;
        }
        .home-btn .desc {
            font-size: 14px;
            color: #6b7a8a;
            margin-top: 6px;
            font-weight: 300;
        }
        .home-btn.exam {
            background: rgba(30, 58, 95, 0.06);
        }
        .home-btn.review {
            background: rgba(74, 158, 111, 0.06);
        }

        /* ---------- 考试页统计（复用） ---------- */
        .header .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-top: 12px;
            font-size: 13px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            padding-top: 12px;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            width: 100%;
        }
        .header .stats strong {
            font-weight: 400;
        }
        .header .stats .num {
            background: rgba(255, 255, 255, 0.06);
            padding: 0 12px;
            border-radius: 30px;
            font-weight: 300;
            font-size: 13px;
        }
        .header .stats .score-item {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 300;
            font-size: 14px;
        }
        .progress-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #a0c4e8;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* ---------- 题型区块（考试 & 阅题共用） ---------- */
        .section {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 16px 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .section-title {
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #1e3a5f;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }

        .section-title .badge {
            background: #1e3a5f;
            color: #fff;
            font-size: 11px;
            padding: 0 14px;
            border-radius: 30px;
            font-weight: 300;
            line-height: 22px;
        }

        .section-title .count {
            font-size: 12px;
            font-weight: 300;
            color: #6b7a8a;
            margin-left: auto;
        }

        /* ---------- 题目卡片 ---------- */
        .question {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(0, 0, 0, 0.02);
            border-radius: 16px;
            padding: 16px 16px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .question.correct {
            border-left: 4px solid #4a9e6f;
            background: rgba(74, 158, 111, 0.06);
        }

        .question.wrong {
            border-left: 4px solid #c75c5c;
            background: rgba(199, 92, 92, 0.06);
        }

        .question .qhead {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .question .qhead .qid {
            font-weight: 300;
            color: #1e3a5f;
            font-size: 14px;
            min-width: 32px;
        }

        .question .qhead .qtype {
            font-size: 10px;
            background: rgba(0, 0, 0, 0.04);
            color: #4e5e6e;
            padding: 0 12px;
            border-radius: 30px;
            font-weight: 300;
            line-height: 20px;
        }

        .question .qhead .answered-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .question .qhead .answered-dot.done {
            background: #4a9e6f;
        }

        .question .qtext {
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 12px;
            padding-left: 2px;
            color: #1a2632;
            font-weight: 300;
            word-break: break-word;
        }

        .multi-hint {
            font-size: 11px;
            color: #7a8a9a;
            margin: 2px 0 8px 8px;
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        /* 正确答案展示（阅题模式） */
        .answer-reveal {
            font-size: 13px;
            color: #1e3a5f;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(30, 58, 95, 0.04);
            border-radius: 12px;
            font-weight: 300;
            letter-spacing: 0.04em;
        }
        .answer-reveal strong {
            font-weight: 400;
        }

        /* ---------- 选项 ---------- */
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            padding-left: 2px;
        }

        .options .opt {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 14px 4px 10px;
            border-radius: 30px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            min-height: 34px;
            font-weight: 300;
        }

        .options .opt:active {
            transform: scale(0.96);
        }

        .options .opt input[type="radio"],
        .options .opt input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #1e3a5f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .options .opt .label {
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
        }

        .options .opt.correct-answer {
            border-color: #4a9e6f;
            background: rgba(74, 158, 111, 0.10);
        }

        .options .opt.wrong-answer {
            border-color: #c75c5c;
            background: rgba(199, 92, 92, 0.10);
        }

        .options .opt.selected {
            border-color: #1e3a5f;
            background: rgba(30, 58, 95, 0.04);
        }

        /* 阅题模式下选项不可交互 */
        .review .options .opt {
            cursor: default;
        }
        .review .options .opt input {
            pointer-events: none;
        }

        /* ---------- 底部操作栏（考试） ---------- */
        .submit-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 16px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
        }

        .submit-area .info {
            font-size: 13px;
            color: #4e5e6e;
            font-weight: 300;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .submit-area .info strong {
            color: #1e3a5f;
            font-weight: 400;
        }

        .btn {
            border: none;
            padding: 10px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.2s;
            background: #1e3a5f;
            color: #fff;
            box-shadow: 0 2px 12px rgba(30, 58, 95, 0.08);
            white-space: nowrap;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.secondary {
            background: rgba(0, 0, 0, 0.04);
            color: #1f2a36;
            box-shadow: none;
        }

        .btn.secondary:active {
            background: rgba(0, 0, 0, 0.08);
        }

        /* ---------- 结果弹窗 ---------- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            padding: 32px 24px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
            animation: modalIn 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal .result-icon {
            font-size: 42px;
            text-align: center;
            margin-bottom: 2px;
            font-weight: 300;
        }

        .modal .result-title {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 0.06em;
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 4px;
        }

        .modal .result-sub {
            text-align: center;
            color: #6b7a8a;
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 16px;
        }

        .modal .score-box {
            background: #f5f7fa;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            margin: 8px 0 16px;
        }

        .modal .score-box .big {
            font-size: 42px;
            font-weight: 300;
            color: #1e3a5f;
        }

        .modal .score-box .big.pass {
            color: #4a9e6f;
        }

        .modal .score-box .big.fail {
            color: #c75c5c;
        }

        .modal .score-box .label {
            font-size: 13px;
            color: #6b7a8a;
            font-weight: 300;
        }

        .modal .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0 20px;
        }

        .modal .detail-grid .item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
        }

        .modal .detail-grid .item .num {
            font-size: 20px;
            font-weight: 300;
            color: #1e2a36;
        }

        .modal .detail-grid .item .lbl {
            font-size: 11px;
            color: #7a8a9a;
            font-weight: 300;
        }

        .modal .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal .actions .btn {
            padding: 10px 28px;
            font-size: 14px;
            flex: 1 1 auto;
            min-width: 100px;
            text-align: center;
        }

        /* ---------- 底部作者 ---------- */
        .footer-info {
            text-align: center;
            color: #7a8a9a;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.04em;
            padding: 16px 0 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 0 0 14px 14px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 640px) {
            .header {
                padding: 16px 14px;
                border-radius: 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header .btn-back {
                align-self: flex-start;
            }
            .header h1 {
                font-size: 19px;
            }
            .header .stats {
                font-size: 12px;
                gap: 6px 12px;
            }
            .header .stats .score-item {
                font-size: 13px;
                padding: 0 10px;
            }
            .section {
                padding: 14px 12px 16px;
                border-radius: 16px;
            }
            .section-title {
                font-size: 15px;
            }
            .question {
                padding: 14px 12px;
                border-radius: 14px;
            }
            .question .qtext {
                font-size: 13px;
            }
            .options .opt {
                font-size: 12px;
                padding: 3px 12px 3px 8px;
                min-height: 30px;
            }
            .options .opt .label {
                font-size: 12px;
            }
            .options .opt input[type="radio"],
            .options .opt input[type="checkbox"] {
                width: 14px;
                height: 14px;
            }
            .submit-area {
                padding: 8px 12px;
                gap: 8px 12px;
            }
            .submit-area .info {
                font-size: 12px;
            }
            .btn {
                padding: 8px 20px;
                font-size: 14px;
            }
            .modal {
                padding: 24px 16px;
            }
            .modal .score-box .big {
                font-size: 36px;
            }
            .modal .detail-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
            }
            .modal .detail-grid .item .num {
                font-size: 18px;
            }
            .footer-info {
                font-size: 12px;
                padding: 12px 0 16px;
            }
            .home-grid {
                max-width: 100%;
                margin: 20px auto;
            }
            .home-btn {
                padding: 28px 16px;
            }
            .home-btn .icon {
                font-size: 32px;
            }
            .home-btn .label {
                font-size: 18px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 17px;
            }
            .header .sub span {
                font-size: 10px;
                padding: 0 8px;
            }
            .header .stats {
                font-size: 11px;
                gap: 4px 8px;
            }
            .question .qtext {
                font-size: 12px;
            }
            .options {
                gap: 4px 6px;
            }
            .options .opt {
                font-size: 11px;
                padding: 2px 10px 2px 6px;
                min-height: 26px;
            }
            .options .opt .label {
                font-size: 11px;
            }
            .btn {
                font-size: 13px;
                padding: 6px 16px;
            }
            .modal .score-box .big {
                font-size: 30px;
            }
            .footer-info {
                font-size: 11px;
                padding: 10px 0 14px;
            }
            .home-btn .icon {
                font-size: 28px;
            }
            .home-btn .label {
                font-size: 16px;
            }
            .home-btn .desc {
                font-size: 12px;
            }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #e9edf2;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c8d0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a8b0;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ========== 主页 ========== -->
        <div id="page-home" class="page active">
            <header class="header" style="justify-content:center;">
                <h1>森林消防 · 学习系统</h1>
                <div class="sub">
                    <span>120道精选题库</span>
                    <span>模拟考试 · 阅题复习</span>
                </div>
            </header>
            <div class="home-grid">
                <div class="home-btn exam" id="btnExam">
                    <div class="icon">📝</div>
                    <div class="label">模拟考试</div>
                    <div class="desc">随机抽取50题，限时自测，每题2分</div>
                </div>
                <div class="home-btn review" id="btnReview">
                    <div class="icon">📖</div>
                    <div class="label">阅题模式</div>
                    <div class="desc">浏览全部120道题及正确答案</div>
                </div>
            </div>
            <div class="footer-info">作者：云和森林消防员 张昌勇</div>
        </div>

        <!-- ========== 考试页 ========== -->
        <div id="page-exam" class="page">
            <header class="header">
                <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; width:100%;">
                    <h1>模拟考试</h1>
                    <button class="btn-back" id="backHomeExam">返回主页</button>
                </div>
                <div class="sub">
                    <span>50题（随机）</span>
                    <span>每题2分</span>
                    <span>80分及格</span>
                    <span>不限时</span>
                </div>
                <div class="stats">
                    <span>已答 <strong id="answeredCount">0</strong> / 50</span>
                    <span>正确 <strong id="correctCount">0</strong></span>
                    <span>错误 <strong id="wrongCount">0</strong></span>
                    <span class="score-item">得分 <strong id="liveScore">0</strong></span>
                </div>
                <div class="progress-bar">
                    <div class="fill" id="progressFill"></div>
                </div>
            </header>

            <div id="questionContainer"></div>

            <div class="footer-info">作者：云和森林消防员 张昌勇</div>

            <!-- 底部操作栏 -->
            <div class="submit-area">
                <span class="info">已答 <strong id="footerAnswered">0</strong> / 50</span>
                <button class="btn" id="submitBtn">提交</button>
                <button class="btn secondary" id="resetBtn">重新抽题</button>
            </div>
        </div>

        <!-- ========== 阅题页 ========== -->
        <div id="page-review" class="page review">
            <header class="header">
                <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; width:100%;">
                    <h1>阅题模式 · 全部题库</h1>
                    <button class="btn-back" id="backHomeReview">返回主页</button>
                </div>
                <div class="sub">
                    <span>共120题</span>
                    <span>判断40 · 单选55 · 多选25</span>
                </div>
            </header>

            <div id="reviewContainer"></div>

            <div class="footer-info">作者：云和森林消防员 张昌勇</div>

        // 3. 考试模块（与之前基本相同，但抽题函数独立）
        // ============================================================
        let currentExam = null;
        const userAnswers = new Map();
        let isSubmitted = false;
        const TOTAL = 50;
        const PASS_SCORE = 80;
        const containerExam = document.getElementById('questionContainer');

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function pickRandom(arr, n) {
            const copy = [...arr];
            shuffle(copy);
            return copy.slice(0, n);
        }

        function generateExam() {
            const tf = pickRandom(tfPool, 15);
            const sc = pickRandom(scPool, 10);
            const mc = pickRandom(mcPool, 25);
            return { tf, sc, mc };
        }

        function initExam() {
            // 重置状态
            currentExam = generateExam();
            userAnswers.clear();
            isSubmitted = false;
            document.getElementById('resultModal').classList.remove('active');
            renderExam();
            // 重置统计显示
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            document.getElementById('liveScore').textContent = '0';
            updateStats();
        }

        function renderExam() {

            currentExam.tf.forEach((q, idx) => {
                const key = `tf_${idx}`;
                const selected = userAnswers.get(key);
                html += renderTFQuestion(q, globalIdx++, key, selected);
            });
            html += `</div>`;

            html +=
                `<div class="section"><div class="section-title"><span>单选题</span><span class="badge">10题</span><span class="count">每题2分</span></div>`;
            currentExam.sc.forEach((q, idx) => {
                const key = `sc_${idx}`;
                const selected = userAnswers.get(key);
                html += renderSCQuestion(q, globalIdx++, key, selected);
            });
            html += `</div>`;

            html +=
                `<div class="section"><div class="section-title"><span>多选题</span><span class="badge">25题</span><span class="count">每题2分（全对才得分）</span></div>`;
            currentExam.mc.forEach((q, idx) => {
                const key = `mc_${idx}`;
                const selected = userAnswers.get(key) || [];
                html += renderMCQuestion(q, globalIdx++, key, selected);
            });
            html += `</div>`;

            containerExam.innerHTML = html;
            bindExamEvents();
            updateStats();
        }

        function renderTFQuestion(q, globalIdx, key, selected) {
            const checkedTrue = selected === true ? 'checked' : '';
            const checkedFalse = selected === false ? 'checked' : '';
            const done = selected !== undefined;
            return `<div class="question" data-key="${key}" data-type="tf">
                <div class="qhead"><span class="qid">${globalIdx}.</span><span class="qtype">判断</span><span class="answered-dot ${done?'done':''}"></span></div>
                <div class="qtext">${q.text}</div>
                <div class="options">
                    <label class="opt" data-value="true"><input type="radio" name="${key}" value="true" ${checkedTrue} /><span class="label">正确</span></label>
                    <label class="opt" data-value="false"><input type="radio" name="${key}" value="false" ${checkedFalse} /><span class="label">错误</span></label>
                </div>
            </div>`;
        }

        function renderSCQuestion(q, globalIdx, key, selected) {
            let optHtml = q.options.map(opt => {
                const letter = opt.charAt(0);
                const checked = selected === letter ? 'checked' : '';
                return `<label class="opt" data-value="${letter}"><input type="radio" name="${key}" value="${letter}" ${checked} /><span class="label">${opt}</span></label>`;
            }).join('');
            const done = selected !== undefined;
            return `<div class="question" data-key="${key}" data-type="sc">
                <div class="qhead"><span class="qid">${globalIdx}.</span><span class="qtype">单选</span><span class="answered-dot ${done?'done':''}"></span></div>
                <div class="qtext">${q.text}</div>
                <div class="options">${optHtml}</div>
            </div>`;
        }

        function renderMCQuestion(q, globalIdx, key, selected) {
            const selectedSet = new Set(selected);
            let optHtml = q.options.map(opt => {
                const letter = opt.charAt(0);
                const checked = selectedSet.has(letter) ? 'checked' : '';
                return `<label class="opt" data-value="${letter}"><input type="checkbox" name="${key}" value="${letter}" ${checked} /><span class="label">${opt}</span></label>`;
            }).join('');
            const done = selected.length > 0;
            return `<div class="question" data-key="${key}" data-type="mc">
                <div class="qhead"><span class="qid">${globalIdx}.</span><span class="qtype">多选</span><span class="answered-dot ${done?'done':''}"></span></div>
                <div class="qtext">${q.text}</div>
                <div class="multi-hint">全部选对才得2分</div>
                <div class="options">${optHtml}</div>
            </div>`;
        }

        function bindExamEvents() {
            containerExam.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
                input.addEventListener('change', function(e) {
                    if (isSubmitted) return;
                    const qDiv = this.closest('.question');
                    if (!qDiv) return;
                    const key = qDiv.dataset.key;
                    const type = qDiv.dataset.type;

                    if (type === 'tf' || type === 'sc') {
                        const checked = qDiv.querySelector('input:checked');
                        if (checked) {
                            const val = checked.value;
                            userAnswers.set(key, type === 'tf' ? val === 'true' : val);
                        } else {
                            userAnswers.delete(key);
                        }
                    } else if (type === 'mc') {
                        const checks = qDiv.querySelectorAll('input[type="checkbox"]:checked');
                        const vals = Array.from(checks).map(el => el.value);
                        if (vals.length > 0) {
                            userAnswers.set(key, vals);
                        } else {
                            userAnswers.delete(key);
                        }
                    }
                    updateStats();
                    updateDot(key);
                });
            });

            containerExam.querySelectorAll('.opt').forEach(label => {
                label.addEventListener('click', function(e) {
                    const input = this.querySelector('input');
                    if (!input) return;
                    setTimeout(() => {
                        const event = new Event('change', { bubbles: true });
                        input.dispatchEvent(event);
                    }, 10);
                });
            });
        }

        function updateDot(key) {
            const qDiv = document.querySelector(`#page-exam .question[data-key="${key}"]`);
            if (!qDiv) return;
            const dot = qDiv.querySelector('.answered-dot');
            if (dot) {
                dot.classList.toggle('done', userAnswers.has(key));
            }
        }

        function updateStats() {
            let answered = userAnswers.size;
            let correct = 0,
                wrong = 0;
            if (isSubmitted) {
                const r = calculateScore();
                answered = r.answered;
                correct = r.correct;
                wrong = r.wrong;
            }
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('footerAnswered').textContent = answered;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            const liveScore = isSubmitted ? calculateScore().score : 0;
            document.getElementById('liveScore').textContent = liveScore;
            const pct = Math.round((answered / TOTAL) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
        }

        function calculateScore() {
            let correct = 0,
                wrong = 0,
                answered = 0;
            currentExam.tf.forEach((q, idx) => {
                const key = `tf_${idx}`;
                const ans = userAnswers.get(key);
                if (ans === undefined) return;
                answered++;
                if (ans === q.answer) correct++;
                else wrong++;
            });
            currentExam.sc.forEach((q, idx) => {
                const key = `sc_${idx}`;
                const ans = userAnswers.get(key);
                if (ans === undefined) return;
                answered++;
                if (ans === q.answer) correct++;
                else wrong++;
            });
            currentExam.mc.forEach((q, idx) => {
                const key = `mc_${idx}`;
                const ans = userAnswers.get(key) || [];
                if (ans.length === 0) return;
                answered++;
                const correctAnswer = q.answer;
                const sortedAns = [...ans].sort();
                const sortedCorrect = [...correctAnswer].sort();
                if (sortedAns.length === sortedCorrect.length && sortedAns.every((v, i) => v === sortedCorrect[i])) {
                    correct++;
                } else {
                    wrong++;
                }
            });
            return { score: correct * 2, correct, wrong, answered, total: TOTAL };
        }

        function submitExam() {
            if (isSubmitted) { showResult(); return; }
            const answered = userAnswers.size;
            if (answered < TOTAL) {
                if (!confirm(`还有 ${TOTAL - answered} 道题未作答，确定提交吗？`)) return;
            }
            isSubmitted = true;
            const result = calculateScore();
            markAnswers();
            updateStats();
            showResult(result, result.score >= PASS_SCORE);
        }

        function markAnswers() {
            currentExam.tf.forEach((q, idx) => {
                const key = `tf_${idx}`;
                const qDiv = document.querySelector(`#page-exam .question[data-key="${key}"]`);
                if (!qDiv) return;
                const ans = userAnswers.get(key);
                const isCorrect = ans === q.answer;
                qDiv.classList.remove('correct', 'wrong');
                if (ans !== undefined) qDiv.classList.add(isCorrect ? 'correct' : 'wrong');
                qDiv.querySelectorAll('.opt').forEach(label => {
                    const val = label.dataset.value === 'true';
                    label.classList.remove('correct-answer', 'wrong-answer');
                    if (ans !== undefined) {
                        if (val === q.answer) label.classList.add('correct-answer');
                        else if (val === ans && ans !== q.answer) label.classList.add('wrong-answer');
                    }
                });
            });
            currentExam.sc.forEach((q, idx) => {
                const key = `sc_${idx}`;
                const qDiv = document.querySelector(`#page-exam .question[data-key="${key}"]`);
                if (!qDiv) return;
                const ans = userAnswers.get(key);
                const isCorrect = ans === q.answer;
                qDiv.classList.remove('correct', 'wrong');
                if (ans !== undefined) qDiv.classList.add(isCorrect ? 'correct' : 'wrong');
                qDiv.querySelectorAll('.opt').forEach(label => {
                    const val = label.dataset.value;
                    label.classList.remove('correct-answer', 'wrong-answer');
                    if (ans !== undefined) {
                        if (val === q.answer) label.classList.add('correct-answer');
                        else if (val === ans && ans !== q.answer) label.classList.add('wrong-answer');
                    }
                });
            });
            currentExam.mc.forEach((q, idx) => {
                const key = `mc_${idx}`;
                const qDiv = document.querySelector(`#page-exam .question[data-key="${key}"]`);
                if (!qDiv) return;
                const ans = userAnswers.get(key) || [];
                const correctAnswer = q.answer;
                const sortedAns = [...ans].sort();
                const sortedCorrect = [...correctAnswer].sort();
                const isCorrect = sortedAns.length === sortedCorrect.length &&
                    sortedAns.every((v, i) => v === sortedCorrect[i]);
                qDiv.classList.remove('correct', 'wrong');
                if (ans.length > 0) qDiv.classList.add(isCorrect ? 'correct' : 'wrong');
                qDiv.querySelectorAll('.opt').forEach(label => {
                    const val = label.dataset.value;
                    label.classList.remove('correct-answer', 'wrong-answer');
                    if (ans.length > 0) {
                        if (correctAnswer.includes(val)) label.classList.add('correct-answer');
                        else if (ans.includes(val) && !correctAnswer.includes(val)) label.classList.add(
                            'wrong-answer');
                    }
                });
            });
        }

        function showResult(result, passed) {
            const modal = document.getElementById('resultModal');
            document.getElementById('resultIcon').textContent = passed ? '✔' : '✖';
            document.getElementById('resultTitle').textContent = passed ? '恭喜通过' : '未通过';
            document.getElementById('resultSub').textContent = passed ? '已达到80分及格线' : '再接再厉，继续加油';
            const scoreEl = document.getElementById('finalScore');
            scoreEl.textContent = result.score;
            scoreEl.className = 'big ' + (passed ? 'pass' : 'fail');
            const status = document.getElementById('passStatus');
            status.textContent = passed ? '及格' : '不及格';
            status.style.color = passed ? '#4a9e6f' : '#c75c5c';
            document.getElementById('rTotal').textContent = result.total;
            document.getElementById('rCorrect').textContent = result.correct;
            document.getElementById('rWrong').textContent = result.wrong;
            modal.classList.add('active');
        }

        // 按钮事件
        document.getElementById('submitBtn').addEventListener('click', submitExam);
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (isSubmitted && !confirm('重新抽题将丢失当前进度，确定吗？')) return;
            currentExam = generateExam();
            userAnswers.clear();
            isSubmitted = false;
            document.getElementById('resultModal').classList.remove('active');
            renderExam();
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            document.getElementById('liveScore').textContent = '0';
            updateStats();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        document.getElementById('closeResultBtn').addEventListener('click', function() {
            document.getElementById('resultModal').classList.remove('active');
        });
        document.getElementById('retryBtn').addEventListener('click', function() {
            document.getElementById('resultModal').classList.remove('active');
            // 重新抽题
            currentExam = generateExam();
            userAnswers.clear();
            isSubmitted = false;
            renderExam();
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            document.getElementById('liveScore').textContent = '0';
            updateStats();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ============================================================
        // 4. 阅题模式（显示全部120题及答案）
        // ============================================================
        function renderReview() {
            const container = document.getElementById('reviewContainer');
            let html = '';
            let globalIdx = 1;

            // 判断题
            html += `<div class="section"><div class="section-title"><span>判断题</span><span class="badge">40题</span></div>`;
            tfPool.forEach(q => {
                html += renderReviewQuestion(q, globalIdx++, '判断', q.answer ? '正确' : '错误');
            });
            html += `</div>`;

            // 单选题
            html += `<div class="section"><div class="section-title"><span>单选题</span><span class="badge">55题</span></div>`;
            scPool.forEach(q => {
                const correctLetter = q.answer;
                const correctText = q.options.find(opt => opt.startsWith(correctLetter));
                html += renderReviewQuestion(q, globalIdx++, '单选', correctText || correctLetter);
            });
            html += `</div>`;

            // 多选题
            html += `<div class="section"><div class="section-title"><span>多选题</span><span class="badge">25题</span></div>`;
            mcPool.forEach(q => {
                const correctLetters = q.answer.join('、');
                const correctTexts = q.answer.map(letter => q.options.find(opt => opt.startsWith(letter))).filter(Boolean)
                    .join('；');
                html += renderReviewQuestion(q, globalIdx++, '多选', correctTexts || correctLetters);
            });
            html += `</div>`;

            container.innerHTML = html;
        }

        function renderReviewQuestion(q, idx, type, answerText) {
            // 构建选项显示
            let optionsHtml = '';
            if (q.options) {
                optionsHtml = `<div class="options">`;
                q.options.forEach(opt => {
                    const letter = opt.charAt(0);
                    // 判断是否为正确选项（用于多选高亮）
                    const isCorrect = (type === '多选') ? q.answer.includes(letter) : (letter === q.answer);
                    const cls = isCorrect ? ' opt correct-answer' : '';
                    optionsHtml += `<div class="opt${cls}" style="cursor:default;"><span class="label">${opt}</span></div>`;
                });
                optionsHtml += `</div>`;
            } else {
                // 判断题无选项，显示正确/错误
                optionsHtml = `<div class="options"><div class="opt correct-answer" style="cursor:default;"><span class="label">${answerText}</span></div></div>`;
            }

            return `<div class="question">
                <div class="qhead"><span class="qid">${idx}.</span><span class="qtype">${type}</span></div>
                <div class="qtext">${q.text}</div>
                ${optionsHtml}
                <div class="answer-reveal"><strong>正确答案：</strong>${answerText}</div>
            </div>`;
        }

        // ============================================================
        // 5. 启动时默认显示主页（已激活）
        // ============================================================
        // 页面加载后，默认主页已激活，无需额外操作。
        // 但考试页需要初始化，但进入时才生成，避免初始加载影响性能。
        // 当用户点击“模拟考试”时会调用 initExam。
    </script>
</body>
</html>
